name: Testar QET entradas eletricas e dimensionamento

on:
  push:
    branches:
      - feature/dados-eletricos-dimensionamento
    paths-ignore:
      - 'validation/status-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo QET deste repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          ref: feature/dados-eletricos-dimensionamento

      - name: Instalar ambiente Windows (MSYS2, Qt6 e KDE6)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git
            python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-qt6-pdf
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-kwidgetsaddons
            mingw-w64-ucrt-x86_64-kcoreaddons
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-angleproject
            mingw-w64-ucrt-x86_64-qt6-declarative

      - name: Aplicar alteracao nativa de identificacao de fios
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # Checkout Windows may convert LF -> CRLF for text patches.
          # Remove only the carriage return at line endings, then check
          # patch context without misclassifying CR as trailing whitespace.
          sed -i 's/\r$//' qet-native-forca-comando.patch
          sed -i 's/\r$//' sources/qetdiagrameditor.cpp sources/qetgraphicsitem/conductor.cpp
          git apply --ignore-space-at-eol --whitespace=nowarn --check qet-native-forca-comando.patch
          git apply --ignore-space-at-eol --whitespace=nowarn qet-native-forca-comando.patch
          grep -q 'AutoWireProperties::run' sources/qetdiagrameditor.cpp
          grep -q 'AutoWireProperties::showReport' sources/qetdiagrameditor.cpp
          grep -q 'QetWirePrecalc::calculate' sources/automation/autowireproperties.h
          grep -q 'selectedCircuit' sources/automation/autowireproperties.h
          grep -q 'classificationOnly' sources/automation/autowireproperties.h
          grep -q 'section = 0.;' sources/automation/autowireproperties.h
          grep -q 'Gravações verificadas' sources/automation/autowireproperties.h
          echo 'Patch REV2 com relatorio e verificacao integrado ao menu Editar.'

      - name: Testar os calculos C++ isoladamente
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          g++ -std=c++17 -Wall -Wextra -Werror tests/custom/test_wireprecalc.cpp -o test_wireprecalc.exe
          ./test_wireprecalc.exe

      - name: Compilar o executavel QElectroTech.exe
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/ucrt64 \
            -DQt6_DIR=/ucrt64/lib/cmake/Qt6 \
            -DQT_VERSION_MAJOR=6 \
            -DBUILD_WITH_KF=ON \
            -DBUILD_KF=OFF \
            -DPACKAGE_TESTS=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0077=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DQET_EXPORT_PROJECT_DB=ON \
            -DQET_ENABLE_SPACEMOUSE=OFF \
            -DSQLite3_INCLUDE_DIR=/ucrt64/include \
            -DSQLite3_LIBRARY=/ucrt64/lib/libsqlite3.dll.a
          cmake --build build --parallel 4
          EXE=$(find "$GITHUB_WORKSPACE/build" -maxdepth 3 -iname 'qelectrotech.exe' | head -1)
          test -n "$EXE"
          test -s "$EXE"
          echo "Executavel compilado: $EXE"

      - name: Testar propriedades reais do QET em projeto (salvar/reabrir, desfazer e geometria)
        shell: msys2 {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          EXE=$(find "$GITHUB_WORKSPACE/build" -maxdepth 3 -iname 'qelectrotech.exe' | head -1)
          test -s "$EXE"
          python3 tests/qttest/run_lazy_folios_probe.py \
            --build "$GITHUB_WORKSPACE/build" \
            --binary "$EXE" \
            --source "$GITHUB_WORKSPACE/tests/qttest/wire_properties_probe.cpp" \
            --fixture "$GITHUB_WORKSPACE/examples/industrial.qet"
          test -s "$GITHUB_WORKSPACE/build/lazy-folios/results.txt"
          grep -q 'PASS QET native integration' "$GITHUB_WORKSPACE/build/lazy-folios/results.txt"

      - name: Rodar testes automatizados disponiveis
        shell: msys2 {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build"
          ctest --output-on-failure --timeout 300

      - name: Gerar pasta portatil Windows com dependencias
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          DEST="$GITHUB_WORKSPACE/QET-ForcaComando-Portatil"
          mkdir -p "$DEST/bin" "$DEST/conf" "$DEST/lang"
          EXE=$(find "$GITHUB_WORKSPACE/build" -maxdepth 3 -iname 'qelectrotech.exe' | head -1)
          cp "$EXE" "$DEST/bin/QElectroTech.exe"
          cd "$DEST/bin"
          /ucrt64/bin/windeployqt6 --release --no-translations --no-compiler-runtime ./QElectroTech.exe
          # Pacote C++ MinGW
          cp /ucrt64/bin/libgcc_s_seh-1.dll .
          cp /ucrt64/bin/libstdc++-6.dll .
          cp /ucrt64/bin/libwinpthread-1.dll .
          # DLLs transitivas, conforme pratica do workflow oficial Windows do QET.
          for pass in 1 2 3; do
            for f in ./*.dll ./*.exe ./sqldrivers/*.dll ./platforms/*.dll ./imageformats/*.dll; do
              test -f "$f" || continue
              while IFS= read -r dll; do
                test -f "$dll" || continue
                cp -n "$dll" . || true
              done < <(ldd "$f" 2>/dev/null | awk '/=> \/ucrt64\/bin\// {print $3}')
            done
          done
          cp -r "$GITHUB_WORKSPACE/elements" "$DEST/elements"
          cp -r "$GITHUB_WORKSPACE/titleblocks" "$DEST/titleblocks"
          cp -r "$GITHUB_WORKSPACE/fonts" "$DEST/fonts" || true
          cp -r "$GITHUB_WORKSPACE/examples" "$DEST/examples" || true
          cp "$GITHUB_WORKSPACE/misc/Lancer QET_qt6.bat" "$DEST/Abrir QElectroTech.bat"
          find "$GITHUB_WORKSPACE/build/lang" -maxdepth 1 -name 'qet_*.qm' -exec cp {} "$DEST/lang/" \; 2>/dev/null || true
          for file in "$GITHUB_WORKSPACE"/LICENSE* "$GITHUB_WORKSPACE"/ELEMENTS.LICENSE; do
            test -f "$file" && cp "$file" "$DEST/" || true
          done
          test -s "$DEST/bin/QElectroTech.exe"
          test -d "$DEST/elements"
          printf 'QElectroTech prototipo - Fonte: feature/dados-eletricos-dimensionamento\nCommit: %s\nAba Editar: Ver características técnicas dos fios...\n' "$(git rev-parse HEAD)" > "$DEST/REVISAO-3-ENTRADAS-LEIA-ME.txt"
          echo 'Pacote REV2 preparado.'

      - name: Disponibilizar download do aplicativo Windows
        uses: actions/upload-artifact@v4
        with:
          name: QET-PROTOTIPO-ENTRADAS-ELETRICAS
          path: QET-ForcaComando-Portatil/
          if-no-files-found: error
          retention-days: 7

      - name: Registrar resultado da compilacao na branch
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "validation" | Out-Null
          @"
          status=$env:CI_JOB_STATUS
          run_id=$env:CI_RUN_ID
          tested_commit=$env:CI_SHA
          workflow=testar-qet-eletrico.yml
          note=Only success means calculations, Qt compilation, available ctest and packaging passed; GUI interaction still needs verification.
          "@ | Set-Content -Path "validation/status-qet-eletrico.txt" -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/status-qet-eletrico.txt
          git commit -m "[skip ci] validation result $env:CI_JOB_STATUS run $env:CI_RUN_ID"
          git push origin HEAD:feature/dados-eletricos-dimensionamento

      - name: Guardar logs se a compilacao falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QET-compilacao-logs
          path: |
            build/CMakeFiles/*.log
            build/Testing/Temporary/*.log
            build/lazy-folios/results.txt
          if-no-files-found: ignore
