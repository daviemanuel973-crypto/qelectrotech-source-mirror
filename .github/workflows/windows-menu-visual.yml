name: Windows menu visual capture

on:
  pull_request:
    paths:
      - '.github/workflows/windows-menu-visual.yml'
      - 'misc/capture_windows_menus.py'
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful industrial Windows build run to inspect
        required: true
        default: '40129192499'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0 pywinauto==0.6.9
      - uses: actions/download-artifact@v4
        with:
          name: QET-WINDOWS-COMPILADO-success
          path: package
          run-id: ${{ inputs.package_run_id || '40129192499' }}
          github-token: ${{ github.token }}
      - run: python misc/capture_windows_menus.py package menu-captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QET-Windows-menu-captures
          path: menu-captures/
          if-no-files-found: error
